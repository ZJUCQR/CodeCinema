# Run with `codecinema run __FILM_ID__ all` (or `python src/run.py all` here).
# Edit scenes.json for titles, captions, looks and durations; no Python changes are needed.
# [film] is read by the framework CLI; [settings.*] are this film's settings (override them in film.local.toml or
# with __ENV_PREFIX___<SECTION>_<KEY> / CODECINEMA_<SECTION>_<KEY> environment variables).

[film]
id = "__FILM_ID__"
title = "__FILM_TITLE__"
description = "A configurable three-scene starter with synthesized music."
entry = "src/run.py"
env_prefix = "__ENV_PREFIX__"
template = "starter-v1"
steps = ["plan", "stills", "render", "audio", "assemble", "qc", "all"]
requires = ["ffmpeg", "ffprobe"]

[settings.paths]
out_dir = "out"
final_video = "assets/film/__FILM_ID__.mp4"

[settings.video]
width = 1920
height = 1080
fps = 24
crf = 16
preset = "medium"

[settings.audio]
sample_rate = 48000
true_peak_db = -1.0
