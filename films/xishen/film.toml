[film]
id = "xishen"
title = "I Am Not the God of Drama · Opening Trilogy"
title_zh = "我不是戏神 · 开篇三集"
description = "Three reproducible motion-comic episodes adapting chapters 1–6, with a shared cast, continuity ledger, Mandarin narration, score and subtitles."
entry = "src/run.py"
env_prefix = "XISHEN"
steps = ["plan", "stills", "render", "audio", "assemble", "refresh", "qc", "serve", "blender", "all"]
requires = ["ffmpeg"]

[settings.paths]
out_dir = "out"
final_video = "assets/film/xishen_complete.mp4"

[settings.video]
width = 1920
height = 1080
fps = 24
crf = 18
preset = "fast"
audio_bitrate = "256k"

[settings.render]
jobs = 3

[settings.audio]
sample_rate = 48000
target_lufs = -16.0
true_peak_db = -1.0
narration = "auto"
voice = "Tingting"
speech_rate = 185
