[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codecinema"
version = "2.1.0"
description = "CodeCinema: a framework for making complete short films and screenplay-driven cartoons with code (picture, music, sound, titles, master)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ZJUCQR" }]
requires-python = ">=3.12"
keywords = ["procedural-animation", "generative-art", "blender", "sound-synthesis", "short-film", "framework",
            "cartoon", "screenplay", "soundfont"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
  "Topic :: Multimedia :: Video",
]
# Python packages for shared production tools and example packs.
# External tools: FFmpeg for all films, Blender >= 5.2 for the Blender backend and production packs.
dependencies = ["numpy>=2.0", "scipy>=1.13", "pillow>=10.0", "matplotlib>=3.8", "pyloudnorm>=0.1.1",
                "skia-python>=87.0", "tomlkit>=0.13", "fonttools>=4.40"]

[project.optional-dependencies]
speech = ["mlx-audio==0.5.8; sys_platform == 'darwin' and platform_machine == 'arm64'", "pypinyin>=0.55"]
dev = ["ruff>=0.6", "build>=1.2"]

[project.scripts]
codecinema = "codecinema.cli:main"

[project.urls]
Homepage = "https://zjucqr.github.io/CodeCinema/"
Repository = "https://github.com/ZJUCQR/CodeCinema"

[tool.setuptools.packages.find]
include = ["codecinema*"]
namespaces = false

[tool.setuptools.cmdclass]
build_py = "codecinema.runtime.build.BuildPy"
sdist = "codecinema.runtime.build.Sdist"

[tool.setuptools.exclude-package-data]
codecinema = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.ruff]
line-length = 120
extend-exclude = ["out", ".venv"]

# Film metadata and settings. assets/ paths start at the workspace root.
# Other relative paths start at films/<id>/. Absolute overrides are supported.

[tool.codecinema.films.silvergrass]
title = "Duel in the Silver Grass"
title_zh = "芒原决战"
description = "A 160-second animated samurai duel: Blender 3D characters, choreography and VFX, a synthesized score."
production = "silvergrass"
renderer = "blender"
env_prefix = "SILVERGRASS"
steps = ["check", "build", "preview", "render", "audio", "titles", "assemble", "all"]
requires = ["blender>=5.2", "ffmpeg"]

[tool.codecinema.films.silvergrass.settings.paths]
out_dir = "out"                                   # every generated file (scene, frames, audio, previews)
final_video = "assets/silvergrass/film/芒原决战_Final.mp4"     # the mastered film
lock_dir = ""                                     # render-slot lock files shared by every process; "" = <out_dir>/.locks

[tool.codecinema.films.silvergrass.settings.tools]
blender = ""        # Blender >= 5.2; auto: $BLENDER_BIN, `blender` on PATH, standard install folders
ffmpeg = ""         # auto: $FFMPEG, `ffmpeg` on PATH
ffprobe = ""        # auto: $FFPROBE, `ffprobe` on PATH
python = ""         # interpreter for plots launched from Blender; auto: .venv, then python3 on PATH

[tool.codecinema.films.silvergrass.settings.fonts]
# Title-card fonts (TTF/OTF/TTC). Auto-detection searches the OS font folders and assets/<id>/fonts/ and assets/_shared/fonts/ for known file
# names (e.g. STXingkai, Weibei, Kaiti, Songti, Zhi Mang Xing, Ma Shan Zheng, LXGW WenKai, Noto Serif CJK).
calligraphy = ""    # main title, name cards, act cards, "End"
weibei = ""         # heavy display face
kaiti = ""          # epigraph, credit line
song = ""           # small print
ui = ""             # labels on diagnostic sheets (pose atlas); auto: Arial / Helvetica / DejaVu Sans
mono = ""           # contact-sheet captions; auto: Menlo / Consolas / DejaVu Sans Mono

[tool.codecinema.films.silvergrass.settings.render]
width = 1920                        # render size (2.35:1), letterboxed to the delivery size in post
height = 816
preview_scale = 0.3333              # preview / layout renders
samples_final = 16                  # EEVEE samples (32+ = cleaner, roughly linearly slower)
samples_preview = 8
motion_blur = true
mb_shutter = 0.5                    # motion-blur shutter (fraction of a frame)
mb_steps = 1                        # motion-blur time steps (per-shot overrides in config.SHOT_RENDER)
mb_steps_sparks = 2                 # steps on frames with fast spark / trail VFX
mb_max_px = 40                      # motion-blur length cap in pixels
filter_size = 1.5                   # pixel filter width
shadow_pool_mb = 1024               # EEVEE shadow pool (lower on GPUs with little memory)
volumetric_tile = 8                 # volumetric tile size in px (smaller = sharper, slower)
volumetric_samples = 64
png_depth = "8"                     # frame PNG bit depth: "8" or "16"
png_compression = 15                # frame PNG compression (0-100)
grass_density_final = 1.0           # fraction of grass instances
grass_density_preview = 0.25
grass_density_layout = 0.12
slots = 2                           # concurrent Blender renders
lock = true                         # share render slots between processes through lock files
min_free_mem_gb = 4.5               # free memory needed before another render slot starts
expected_seconds_per_frame = 12.0   # watchdog estimate before real timings exist
retries = 2                         # render retries per chunk before the fallback
watchdog_factor = 3.0               # a chunk is stuck after factor x expected time + grace
watchdog_grace_s = 120.0
progress_interval_s = 30.0          # supervisor progress line interval
tmp_max_age_s = 600.0               # orphaned temporary frames older than this are swept

[tool.codecinema.films.silvergrass.settings.video]
delivery_width = 1920
delivery_height = 1080
codec = "libx264"
crf = 16                            # final master quality (lower = larger, better)
preset = "slow"
pix_fmt = "yuv420p"
audio_bitrate = "320k"
preview_width = 960                 # `assemble --preview`
preview_height = 540
preview_crf = 23
preview_preset = "veryfast"
preview_audio_bitrate = "192k"
review_crf = 20                     # single-act review clips (`preview <lane>`)
review_audio_bitrate = "128k"

[tool.codecinema.films.silvergrass.settings.audio]
sample_rate = 48000
target_lufs = -14.0                 # integrated loudness of the master
true_peak_db = -1.0                 # true-peak ceiling (dBTP)
loudness_tolerance_lu = 1.0         # QC tolerance around target_lufs
aac_pre_limiter_db = -2.5           # limiter before AAC encoding when the encoded true peak overshoots

[tool.codecinema.films.silvergrass.settings.post]
title_jobs = 0                      # parallel title-card workers; 0 = auto
titles_lock_timeout_s = 900.0

[tool.codecinema.films.silvergrass.settings.dev]
demo_raise = false                  # make the demo lane raise on QA warnings

[tool.codecinema.films.nightrevels]
title = "The Night Revels of Han Xizai, Cat Edition"
title_zh = "韩熙载夜宴图 · 猫"
description = "A 128-second living handscroll: gongbi cats in Tang court costume, drawn as 2D vector puppets on silk."
production = "nightrevels"
renderer = "skia"
env_prefix = "NIGHTREVELS"
steps = ["build", "still", "render", "audio", "assemble", "all"]
requires = ["ffmpeg"]

[tool.codecinema.films.nightrevels.settings.paths]
out_dir = "out"                                 # generated files (events, notes, silk cache, video chunks, audio)
final_video = "assets/nightrevels/film/NightRevels.mp4"     # the mastered film

[tool.codecinema.films.nightrevels.settings.tools]
ffmpeg = ""          # auto: $FFMPEG, `ffmpeg` on PATH
ffprobe = ""

[tool.codecinema.films.nightrevels.settings.render]
jobs = 0             # parallel render processes; 0 = all CPU cores but two
chunk = 96           # frames per encoded chunk (the resumable unit)
crf = 15             # x264 quality of the picture chunks (lower = larger, better)
preset = "medium"

[tool.codecinema.films.nightrevels.settings.video]
audio_bitrate = "320k"

[tool.codecinema.films.nightrevels.settings.audio]
sample_rate = 48000
target_lufs = -14.0
true_peak_db = -1.0

[tool.codecinema.starter]
description = "A configurable three-scene starter with synthesized music."
production = "story"
renderer = "skia"
steps = ["plan", "stills", "render", "audio", "assemble", "qc", "all"]
requires = ["ffmpeg", "ffprobe"]

[tool.codecinema.starter.settings.paths]
out_dir = "out"

[tool.codecinema.starter.settings.video]
width = 1920
height = 1080
fps = 24
crf = 16
preset = "medium"

[tool.codecinema.starter.settings.audio]
sample_rate = 48000
true_peak_db = -1.0

[tool.codecinema.films.pebble]
title = "Pebble"
title_zh = "小企鹅飞起来"
description = "An English-language 3D cartoon: a penguin who cannot fly dives to save his friend and discovers his sky is the sea."
production = "cartoon"
renderer = "blender"
steps = ["plan", "voices", "stills", "render", "audio", "assemble", "qc", "all"]
requires = ["blender>=5.2", "ffmpeg"]

[tool.codecinema.films.pebble.settings.paths]
out_dir = "out"
final_video = "assets/pebble/film/Pebble.mp4"

[tool.codecinema.films.pebble.settings.render]
engine = "eevee"                    # "cycles" renders without a GPU (softer shading, slower)
samples = 24                        # EEVEE anti-aliasing samples per frame
samples_preview = 8
preview_scale = 0.5                 # `render --preview`: half-size frames for a quick full pass
jobs = 2                            # parallel Blender processes

[tool.codecinema.films.pebble.settings.video]
width = 1920
height = 1080
crf = 18
preset = "slow"
audio_bitrate = "256k"

[tool.codecinema.films.pebble.settings.audio]
sample_rate = 48000
target_lufs = -16.0
true_peak_db = -1.0

[tool.codecinema.films.nian]
title = "Nian"
title_zh = "年"
description = "A Mandarin-language 3D cartoon: on New Year's Eve a girl meets the legendary beast Nian, who wears the red scarf her grandmother gave him sixty winters ago."
production = "cartoon"
renderer = "blender"
steps = ["plan", "voices", "stills", "render", "audio", "assemble", "qc", "all"]
requires = ["blender>=5.2", "ffmpeg"]

[tool.codecinema.films.nian.settings.paths]
out_dir = "out"
final_video = "assets/nian/film/Nian.mp4"

[tool.codecinema.films.nian.settings.render]
engine = "eevee"                    # "cycles" renders without a GPU (softer shading, slower)
samples = 24
samples_preview = 8
preview_scale = 0.5
jobs = 2

[tool.codecinema.films.nian.settings.video]
width = 1920
height = 1080
crf = 18
preset = "slow"
audio_bitrate = "256k"

[tool.codecinema.films.nian.settings.audio]
sample_rate = 48000
target_lufs = -16.0
true_peak_db = -1.0
