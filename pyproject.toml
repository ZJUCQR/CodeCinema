[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codecinema"
version = "1.1.0"
description = "CodeCinema: a framework for making complete short films with code (picture, music, sound, titles, master)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ZJUCQR" }]
requires-python = ">=3.12"
keywords = ["procedural-animation", "generative-art", "blender", "sound-synthesis", "short-film", "framework"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
  "Topic :: Multimedia :: Video",
]
# Python packages for the framework and its example films. External tools: ffmpeg (all films) and Blender >= 5.2
# (the SilverGrass and The Last Beacon examples).
dependencies = ["numpy>=2.0", "scipy>=1.13", "pillow>=10.0", "matplotlib>=3.8", "pyloudnorm>=0.1.1",
                "skia-python>=87.0"]

[project.optional-dependencies]
speech = ["mlx-audio==0.5.8; sys_platform == 'darwin' and platform_machine == 'arm64'", "pypinyin>=0.55"]

[project.scripts]
codecinema = "codecinema.cli:main"

[project.urls]
Homepage = "https://zjucqr.github.io/CodeCinema/"
Repository = "https://github.com/ZJUCQR/CodeCinema"

[tool.setuptools]
packages = ["codecinema", "codecinema.audio"]

[tool.setuptools.package-data]
codecinema = ["template/**/*", "studio_assets/**/*", "studio_assets/*"]

[tool.setuptools.exclude-package-data]
codecinema = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.ruff]
line-length = 120
extend-exclude = ["out", ".venv"]
