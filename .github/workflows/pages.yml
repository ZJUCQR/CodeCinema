name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "assets/images/**", "films/*/assets/images/**", "films/xishen/watch.*", ".github/workflows/pages.yml"]
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      refresh_release:
        description: Refresh release media through the default branch
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # The release dispatcher must not cancel the deployment it starts on main.
  group: pages-${{ (github.event_name == 'release' || inputs.refresh_release) && 'dispatch' || 'deploy' }}
  cancel-in-progress: true

jobs:
  release-dispatch:
    if: github.event_name == 'release' || inputs.refresh_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Deploy the release from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --ref "$DEFAULT_BRANCH" --repo "$GITHUB_REPOSITORY"

  build:
    # Release tags are not allowed by the github-pages environment policy.
    if: github.event_name != 'release' && !inputs.refresh_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (the films come from their releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/img/silvergrass _site/img/nightrevels _site/films _site/xishen/assets/film _site/xishen/assets/images
          cp -r site/. _site/
          cp assets/images/* _site/img/
          cp films/silvergrass/assets/images/* _site/img/silvergrass/
          cp films/nightrevels/assets/images/* _site/img/nightrevels/
          cp films/xishen/watch.html films/xishen/watch.css films/xishen/watch.js _site/xishen/
          cp films/xishen/assets/images/* _site/xishen/assets/images/
          gh release download film --repo "${{ github.repository }}" --pattern SilverGrass.mp4 --dir _site/films
          gh release download nightrevels --repo "${{ github.repository }}" --pattern NightRevels.mp4 --dir _site/films
          if [ "$(gh release view xishen --repo "${{ github.repository }}" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            gh release download xishen --repo "${{ github.repository }}" --pattern '*.mp4' --dir _site/xishen/assets/film
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
