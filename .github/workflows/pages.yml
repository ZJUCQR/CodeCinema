name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "assets/images/**", "films/*/assets/images/**", ".github/workflows/pages.yml"]
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      refresh_release:
        description: Refresh release media through the default branch
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # The release dispatcher must not cancel the deployment it starts on main.
  group: pages-${{ (github.event_name == 'release' || inputs.refresh_release) && 'dispatch' || 'deploy' }}
  cancel-in-progress: true

jobs:
  release-dispatch:
    if: github.event_name == 'release' || inputs.refresh_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Deploy the release from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --ref "$DEFAULT_BRANCH" --repo "$GITHUB_REPOSITORY"

  build:
    # Release tags are not allowed by the github-pages environment policy.
    if: github.event_name != 'release' && !inputs.refresh_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (the films come from their releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 site/build.py --repo "$GITHUB_REPOSITORY" --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
