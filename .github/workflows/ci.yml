name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the framework and its dependencies
        run: pip install .
      - name: Check installed package boundaries and resources
        run: >
          python -I -c "import sys, codecinema; from importlib.resources import files;
          assert 'codecinema.workspace.settings' not in sys.modules;
          assert not any(m in sys.modules for m in ('numpy','skia','bpy','mlx_audio'));
          package=files('codecinema');
          assert sorted(p.name for p in package.iterdir() if p.name.endswith('.py'))==['__init__.py','__main__.py'];
          from codecinema.workspace.paths import resource_dir;
          assert resource_dir('scaffold').joinpath('scenes.json').is_file();
          assets=resource_dir('studio');
          assert assets.resolve().is_relative_to(package.resolve());
          assert all(assets.joinpath(p).is_file() for p in ('index.html','studio.js','studio.css'));
          assert len(list(assets.joinpath('presets').iterdir()))==8;
          from codecinema.workspace import settings; from codecinema.runtime import media, blender;
          assert codecinema.settings is settings and codecinema.media is media;
          from codecinema.engine.context import RenderContext;
          from codecinema.studio.jobs import Studio"
      - name: Install FFmpeg and the Linux graphics runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core libgl1 libegl1 libfontconfig1
      - name: Create a starter project
        run: codecinema new ci-preview --preset aurora --duration 3 --quality preview
      - name: Customize one film without changing other configurations
        run: >
          python -c "import copy; from pathlib import Path; from codecinema.workspace import registry, projects, settings;
          root=Path.cwd(); before=copy.deepcopy(registry.definitions(root));
          projects.customize(root/'films/ci-preview', title='CI portrait', format_name='portrait');
          after=registry.definitions(root);
          assert all(after[k]==v for k,v in before.items() if k!='ci-preview');
          assert after['ci-preview']['title']=='CI portrait';
          assert after['ci-preview']['production']=='story';
          assert after['ci-preview']['renderer']=='skia';
          assert not list((root/'films').rglob('*.py'));
          assert not (root/'films/ci-preview/src').exists();
          assert settings.load(root/'films/ci-preview')['video']['width']==360"
      - name: Render a short sample
        if: runner.os == 'Linux'
        run: |
          codecinema run ci-preview all
          python -c "from pathlib import Path; assert Path('assets/ci-preview/film/ci-preview.mp4').is_file(); assert not Path('films/ci-preview/assets').exists()"
      - name: Import a story and honor explicit CLI edits
        run: >
          python -c "import json; from pathlib import Path; from codecinema import cli; from codecinema.workspace import registry;
          source=Path('films/ci-preview/scenes.json'); before=source.read_bytes();
          assert cli.main(['new','ci-import','--story',str(source),'--title','Imported edit',
          '--subtitle','New opening','--duration','6','--preset','ocean'])==0;
          data=json.loads(Path('films/ci-import/scenes.json').read_text(encoding='utf-8'));
          assert data['title']=='Imported edit';
          assert data['scenes'][0]['subtitle']=='New opening';
          assert all(s['preset']=='ocean' for s in data['scenes']);
          assert abs(sum(s['duration_s'] for s in data['scenes'])-6)<1e-9;
          assert registry.definitions(Path.cwd())['ci-import']['title']==data['title'];
          assert source.read_bytes()==before"
      - name: Byte-compile the framework and films
        run: python -m compileall -q codecinema
      - name: List rendering backends
        run: codecinema renderers
      - name: List the films
        run: codecinema list
      - name: Import the framework and the pure-Python film modules
        run: >
          python -c "import sys; sys.path[:0]=['codecinema/productions/silvergrass/common','codecinema/productions/silvergrass/audio','codecinema/productions/silvergrass/post'];
          import config, settings, procutil, dsp, instruments, timeline, assemble, titles;
          from codecinema.runtime import media; from codecinema.workspace import films; from codecinema import cli;
          print('silvergrass shots', len(config.SHOTS), 'sample rate', dsp.SR)"
      - name: Validate Xishen chronology and continuity
        run: >
          python -c "import sys; sys.path.insert(0,'codecinema/productions/xishen');
          import story; print(story.validate())"
